name: Laravel

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, bz2, curl, gd, intl, mbstring, pcntl, pdo_pgsql, pgsql, redis, zip
          coverage: none
      - name: Set output
        id: vars
        run: echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: Check output
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.vars.outputs.tag }}
      - name: Install Dependencies
        run: |
          composer validate --strict
          composer install -q --no-dev --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install NPM dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile assets for production
        run: npm run build
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          filename: '${{ steps.vars.outputs.tag }}.zip'
          exclusions: '*.git* .idea/ /*node_modules/* .editorconfig /tests/* package* webpack* .php* server.php php* README.md ideas.md cypress.json _ide_helper* .styleci.yml .nvmrc tailwind* resources/css/ resources/js/'
      - name: Upload to Spaces
        uses: BetaHuhn/do-spaces-action@v2
        with:
          access_key: ${{ secrets.ACCESS_KEY }}
          secret_key: ${{ secrets.SECRET_KEY }}
          space_name: ${{ secrets.SPACE_NAME }}
          space_region: ${{ secrets.SPACE_REGION }}
          source: '${{ steps.vars.outputs.tag }}.zip'
          out_dir: 'sonar-fms'
          permission: 'public-read'
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: 'The project {{ EVENT_PAYLOAD.repository.full_name }} has been uploaded to Spaces.'

